<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <!-- prevents flashing on theme change -->
    <script>
      const mq = matchMedia("(prefers-color-scheme: dark)");
      // toggles color scheme using ls and system prefernce
      function applyColorScheme() {
        document.documentElement.classList.toggle(
          "dark",
          localStorage.theme === "dark" ||
            (!("theme" in localStorage) && mq.matches),
        );
      }
      applyColorScheme();
      // updates live system theme change
      mq.addEventListener("change", applyColorScheme);
    </script>
  </head>
  <body
    class="bg-zinc-100 text-zinc-950 dark:bg-zinc-950 dark:text-zinc-100 transition-colors duration-200"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
